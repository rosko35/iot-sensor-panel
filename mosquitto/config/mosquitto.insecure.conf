# Mosquitto 2.x - INSECURE profile (default `docker compose up`).
#
# Plain-text MQTT on 1883 with anonymous access. Every byte on the wire,
# including topics and payloads, is readable by anyone on the network, and
# anyone can publish to any topic. This is intentionally the "before" half of
# the security demo (docs/security-demo.md). Never expose this to the internet.

per_listener_settings false

listener 1883 0.0.0.0
protocol mqtt

# Mosquitto 2.0 refuses anonymous clients unless explicitly allowed.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
