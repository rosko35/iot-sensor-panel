; ESP32 sensor node for the IoT sensor panel.
;
;   pio run -e esp32-dht22 -t upload && pio device monitor
;   pio run -e esp32-bme280 -t upload
;
; Before building, copy include/secrets.example.h to include/secrets.h
; (git-ignored) and fill in WiFi / MQTT settings.

[platformio]
default_envs = esp32-dht22

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.1
build_flags =
    -Wall

[env:esp32-dht22]
lib_deps =
    ${env.lib_deps}
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
build_flags =
    ${env.build_flags}
    -DSENSOR_DHT22

[env:esp32-bme280]
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
build_flags =
    ${env.build_flags}
    -DSENSOR_BME280
