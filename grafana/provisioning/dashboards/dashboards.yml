# Load every dashboard JSON file mounted at /etc/grafana/dashboards.
apiVersion: 1

providers:
  - name: iot-sensor-panel
    orgId: 1
    folder: IoT
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
