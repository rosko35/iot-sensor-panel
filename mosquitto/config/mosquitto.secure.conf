# Mosquitto 2.x - SECURE profile (docker-compose.secure.yml).
#
# * TLS only, on 8883 - there is no plain-text listener at all
# * no anonymous access: every client needs a username/password
# * an ACL file restricts each device to its own topics
#
# Required files (generated locally, git-ignored):
#   /mosquitto/certs/{ca.crt,server.crt,server.key}  <- scripts/gen_certs.py or gen_certs.sh
#   /mosquitto/config/passwd                          <- scripts/make_passwd.py

per_listener_settings false

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

listener 8883 0.0.0.0
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
# Minimum protocol version for this listener.
tls_version tlsv1.2
# Clients authenticate with username/password, not client certificates.
require_certificate false

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
