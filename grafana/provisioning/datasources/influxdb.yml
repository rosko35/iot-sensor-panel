# Grafana datasource provisioning: InfluxDB 2 with the Flux query language.
# ${...} values are expanded by Grafana from the container environment.
apiVersion: 1

datasources:
  - name: InfluxDB
    uid: influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: ${INFLUX_ORG}
      defaultBucket: ${INFLUX_BUCKET}
      timeInterval: 5s
    secureJsonData:
      token: ${INFLUX_TOKEN}
